name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build rs3tk-core
        run: uv build --package rs3tk-core --out-dir dist/core

      - name: Build rs3tk
        run: uv build --package rs3tk --out-dir dist/cli

      - name: Publish rs3tk-core
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/core
          skip-existing: true

      - name: Publish rs3tk
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/cli
          skip-existing: true

  appimage:
    name: Build AppImage + DEB + RPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install electron dependencies
        run: |
          pnpm approve-builds || true
          pnpm install

      - name: Build AppImage + DEB + RPM
        working-directory: packages/electron
        run: pnpm run build:release

      - name: Upload AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: packages/electron/dist/*.AppImage
          fail_on_unmatched_files: true

      - name: Upload DEB
        uses: softprops/action-gh-release@v2
        with:
          files: packages/electron/dist/*.deb
          fail_on_unmatched_files: true

      - name: Upload RPM
        uses: softprops/action-gh-release@v2
        with:
          files: packages/electron/dist/*.rpm
          fail_on_unmatched_files: true

  copr:
    name: Publish to Fedora Copr
    runs-on: ubuntu-latest
    needs: appimage
    steps:
      - uses: actions/checkout@v4

      - name: Download RPM from release
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.ref_name }}
          fileName: "*.rpm"

      - name: Install copr-cli
        run: pip install copr-cli

      - name: Publish RPM to Copr
        run: copr-cli create-build --rpms *.rpm calebwhiting/rs3tk
        env:
          COPR_LOGIN: calebwhiting
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}

  aur:
    name: Update AUR package
    runs-on: ubuntu-latest
    needs: appimage
    steps:
      - uses: actions/checkout@v4

      - name: Download AppImage from release
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.ref_name }}
          fileName: RS3TK-*.AppImage

      - name: Calculate checksum
        id: checksum
        run: |
          CHECKSUM=$(sha256sum RS3TK-*.AppImage | cut -d' ' -f1)
          echo "sha256=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKGBUILD="packaging/arch/PKGBUILD"

          # Update version
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$PKGBUILD"

          # Update checksum
          sed -i "s/^sha256sums=.*/sha256sums=('${{ steps.checksum.outputs.sha256 }}' 'SKIP')/" "$PKGBUILD"

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKGBUILD="packaging/arch/PKGBUILD"

          # Update version and checksum in PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$PKGBUILD"
          sed -i "s/^sha256sums=.*/sha256sums=('${{ steps.checksum.outputs.sha256 }}' 'SKIP')/" "$PKGBUILD"

          # Set up SSH
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

          # Clone AUR repo, update, and push
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" \
            git clone "ssh://aur@aur.archlinux.org/rs3tk-bin.git" /tmp/aur
          cp "$PKGBUILD" /tmp/aur/PKGBUILD
          cd /tmp/aur
          git add PKGBUILD
          git diff --cached --quiet || \
            git -c user.name="CalebWhiting" \
                -c user.email="caleb.andrew.whiting@gmail.com" \
                commit -m "v${{ github.ref_name }}: automated update"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" git push
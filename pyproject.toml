[tool.uv.workspace]
members = ["packages/core", "packages/cli"]

[tool.uv.sources]
rs3tk-core = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest>=7", "coverage>=7.0"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["packages/core/src/rs3tk_core/data/"]
cache-dir = ".build/ruff/"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["packages/core/src/rs3tk_core/data/"]
cache_dir = ".build/mypy/"

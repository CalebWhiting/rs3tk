[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rs3tk"
version = "0.1.0"
description = "Open-source Jagex Launcher replacement"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Caleb" },
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "keyring>=25.0",
    "rich>=13.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "coverage>=7.0",
    "pre-commit>=3.0",
]

[project.scripts]
rs3tk = "rs3tk.cli:main"
rs3tk-backend = "rs3tk.backend:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rs3tk = ["data/*.py", "gui/assets/*", "gui/*.ui"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/rs3tk/gui/launcher_ui.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["src/rs3tk/data/", "src/rs3tk/gui/launcher_ui.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["rs3tk"]

[tool.coverage.report]
show_missing = true
skip_empty = true

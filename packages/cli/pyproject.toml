[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rs3tk"
version = "1.0.3"
description = "rs3tk command-line interface and Rich terminal UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Caleb" },
]
dependencies = [
    "rs3tk-core>=1.0,<2",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
rs3tk = "rs3tk_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
cache_dir = "../../.build/mypy/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
cache_dir = "../../.build/pytest/"

[tool.coverage.run]
source = ["rs3tk_cli"]
data_file = "../../.build/coverage/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "../../.build/htmlcov"

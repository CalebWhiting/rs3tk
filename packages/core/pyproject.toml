[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rs3tk-core"
version = "1.1.0"
description = "rs3tk core library - OAuth, Jagex API, RuneMetrics, game client management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Caleb" },
]
dependencies = [
    "httpx>=0.25.1",
    "pydantic>=2.0",
    "keyring>=22.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rs3tk_core = ["data/*.py", "data/*.cjs", "py.typed"]

[tool.mypy]
exclude = ["src/rs3tk_core/data/"]
cache_dir = "../../.build/mypy/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
cache_dir = "../../.build/pytest/"

[tool.coverage.run]
source = ["rs3tk_core"]
data_file = "../../.build/coverage/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "../../.build/htmlcov"

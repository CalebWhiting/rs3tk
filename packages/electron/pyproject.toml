[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rs3tk-electron-bridge"
version = "1.0.0"
description = "rs3tk-electron dev-only package: exposes rs3tk_bridge module and pins rs3tk-core. The prod binary is built by PyInstaller and does not use this."
requires-python = ">=3.11"
dependencies = [
    "rs3tk-core>=1.0,<2",
]

[tool.setuptools]
py-modules = ["rs3tk_bridge"]

[tool.setuptools.package-dir]
"" = "src/bridge"
